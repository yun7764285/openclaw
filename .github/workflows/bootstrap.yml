name: bootstrap

run-name: bootstrap-${{ inputs.runner_name }}

on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: GitHub 托管 runner 的系统标签，例如 ubuntu-22.04、macos-15、windows-2025
        required: true
        type: string
      target_url:
        description: 目标仓库 URL
        required: true
        type: string
      reg_token:
        description: runner 注册令牌
        required: true
        type: string
      runner_name:
        description: runner 名称
        required: true
        type: string
      runner_labels:
        description: 以逗号分隔的 runner 标签
        required: true
        type: string
      runner_version:
        description: actions/runner 版本
        required: false
        default: '2.336.0'
        type: string
      callback_url:
        description: 调度服务的状态回调地址
        required: false
        default: ''
        type: string
      callback_token:
        description: 仅用于本次派发的回调凭据
        required: false
        default: ''
        type: string

jobs:
  bootstrap:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    steps:
      - name: 通知调度器 bootstrap 已启动
        if: inputs.callback_url != '' && inputs.callback_token != ''
        continue-on-error: true
        shell: python
        run: |
          import json, os, time, urllib.error, urllib.request
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              inputs = json.load(source)["inputs"]
          token = inputs["callback_token"]
          print("::add-mask::" + token, flush=True)
          # 先屏蔽凭据，再传给后续步骤；内层 runner 会覆盖事件文件，结束通知不能再读它。
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as target:
              for name, value in {"BOOTSTRAP_CALLBACK_URL": inputs["callback_url"],
                                  "BOOTSTRAP_CALLBACK_TOKEN": token,
                                  "BOOTSTRAP_CALLBACK_RUNNER_NAME": inputs["runner_name"]}.items():
                  target.write(name + "=" + value + "\n")
          body = json.dumps({"action": "started", "runnerName": inputs["runner_name"],
                             "runId": int(os.environ["GITHUB_RUN_ID"])}).encode()
          for attempt in range(2):
              try:
                  request = urllib.request.Request(inputs["callback_url"], data=body, method="POST",
                      headers={"Authorization": "Bearer " + token, "Content-Type": "application/json",
                               "User-Agent": "self-hosted-runner-bootstrap"})
                  with urllib.request.urlopen(request, timeout=5) as response:
                      print("bootstrap callback status: HTTP", response.status)
                  break
              except (urllib.error.URLError, TimeoutError, OSError):
                  if attempt == 1:
                      raise
                  time.sleep(1)

      # 二进制目录与 --work 分开，缓存中只包含未注册的 runner。
      # 不能放进 RUNNER_TEMP：内层 runner 接活时会清空共享的 _temp。
      - name: 设置 runner 目录
        shell: python
        run: |
          import os, pathlib
          work = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve().parent.parent
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as target:
              target.write(f"EPHEMERAL_RUNNER_DIR={work / '.ephemeral-runner'}\n")
              target.write(f"EPHEMERAL_RUNNER_WORK={work}\n")

      # 按系统、架构和版本缓存解压后的文件，命中后直接注册，避免重复解压。
      - name: 恢复 runner 文件缓存
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.EPHEMERAL_RUNNER_DIR }}
          key: runner-files-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.runner_version }}

      - name: 下载 runner（Linux）
        if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
        run: |
          ARCH=x64
          [ "${{ runner.arch }}" = "ARM64" ] && ARCH=arm64
          mkdir -p runner-pkg
          curl --fail --show-error --silent --location --retry 2 -o runner-pkg/actions-runner.tar.gz \
            https://github.com/actions/runner/releases/download/v${{ inputs.runner_version }}/actions-runner-linux-${ARCH}-${{ inputs.runner_version }}.tar.gz

      - name: 下载 runner（macOS）
        if: runner.os == 'macOS' && steps.cache.outputs.cache-hit != 'true'
        run: |
          ARCH=x64
          [ "${{ runner.arch }}" = "ARM64" ] && ARCH=arm64
          mkdir -p runner-pkg
          curl --fail --show-error --silent --location --retry 2 -o runner-pkg/actions-runner.tar.gz \
            https://github.com/actions/runner/releases/download/v${{ inputs.runner_version }}/actions-runner-osx-${ARCH}-${{ inputs.runner_version }}.tar.gz

      - name: 下载 runner（Windows）
        if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $arch = if ("${{ runner.arch }}" -eq "ARM64") { "arm64" } else { "x64" }
          New-Item -ItemType Directory -Force -Path runner-pkg | Out-Null
          Invoke-WebRequest -Uri "https://github.com/actions/runner/releases/download/v${{ inputs.runner_version }}/actions-runner-win-$arch-${{ inputs.runner_version }}.zip" -OutFile runner-pkg/actions-runner.zip

      - name: 解压 runner（Unix）
        if: runner.os != 'Windows' && steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$EPHEMERAL_RUNNER_DIR"
          tar xzf runner-pkg/actions-runner.tar.gz -C "$EPHEMERAL_RUNNER_DIR"

      - name: 解压 runner（Windows）
        if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:EPHEMERAL_RUNNER_DIR | Out-Null
          tar -xf runner-pkg/actions-runner.zip -C "$env:EPHEMERAL_RUNNER_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 必须在注册前保存；注册后目录里会生成 .runner 和 .credentials 等凭据。
      - name: 保存 runner 文件缓存
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.EPHEMERAL_RUNNER_DIR }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: 配置并启动临时 runner（Unix）
        if: runner.os != 'Windows'
        run: |
          cd "$EPHEMERAL_RUNNER_DIR"
          ./config.sh --unattended --ephemeral --replace \
            --url "${{ inputs.target_url }}" \
            --token "${{ inputs.reg_token }}" \
            --name "${{ inputs.runner_name }}" \
            --labels "${{ inputs.runner_labels }}" \
            --work "$EPHEMERAL_RUNNER_WORK"
          ./run.sh

      - name: 配置并启动临时 runner（Windows）
        if: runner.os == 'Windows'
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              inputs = json.load(source)["inputs"]
          print("::add-mask::" + inputs["reg_token"], flush=True)
          directory = pathlib.Path(os.environ["EPHEMERAL_RUNNER_DIR"])
          configured = subprocess.run(["cmd", "/d", "/c", "config.cmd", "--unattended", "--ephemeral", "--replace",
              "--url", inputs["target_url"], "--token", inputs["reg_token"], "--name", inputs["runner_name"],
              "--labels", inputs["runner_labels"], "--work", os.environ["EPHEMERAL_RUNNER_WORK"]], cwd=directory)
          if configured.returncode:
              sys.exit(configured.returncode)
          # 内层 runner 会清理共享 _temp，cmd 会丢失尚未读完的外层脚本；Python 已加载脚本。
          result = subprocess.run(["cmd", "/d", "/c", "run.cmd"], cwd=directory)
          # 正常执行完一个 job 后 .runner 会被删除；尚未注销的异常退出仍须报错。
          if result.returncode and (directory / ".runner").exists():
              sys.exit(result.returncode)

      - name: 通知调度器 bootstrap 已结束
        if: always() && inputs.callback_url != '' && inputs.callback_token != ''
        continue-on-error: true
        shell: python
        run: |
          import json, os, time, urllib.error, urllib.request
          token = os.environ["BOOTSTRAP_CALLBACK_TOKEN"]
          print("::add-mask::" + token, flush=True)
          body = json.dumps({"action": "completed", "runnerName": os.environ["BOOTSTRAP_CALLBACK_RUNNER_NAME"],
                             "runId": int(os.environ["GITHUB_RUN_ID"])}).encode()
          for attempt in range(2):
              try:
                  request = urllib.request.Request(os.environ["BOOTSTRAP_CALLBACK_URL"], data=body, method="POST",
                      headers={"Authorization": "Bearer " + token, "Content-Type": "application/json",
                               "User-Agent": "self-hosted-runner-bootstrap"})
                  with urllib.request.urlopen(request, timeout=5) as response:
                      print("bootstrap callback status: HTTP", response.status)
                  break
              except (urllib.error.URLError, TimeoutError, OSError):
                  if attempt == 1:
                      raise
                  time.sleep(1)
