name: bootstrap

run-name: bootstrap-${{ inputs.runner_name }}

on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: GitHub 托管 runner 的系统标签，例如 ubuntu-22.04、macos-15、windows-2025
        required: true
        type: string
      target_url:
        description: 目标仓库 URL
        required: true
        type: string
      reg_token:
        description: runner 注册令牌
        required: false
        default: ''
        type: string
      jit_config:
        description: 调度器预先生成的 JIT runner 配置
        required: false
        default: ''
        type: string
      runner_name:
        description: runner 名称
        required: true
        type: string
      runner_labels:
        description: 以逗号分隔的 runner 标签
        required: true
        type: string
      callback_url:
        description: 调度服务的状态回调地址
        required: false
        default: ''
        type: string
      callback_token:
        description: 仅用于本次派发的回调凭据
        required: false
        default: ''
        type: string

jobs:
  bootstrap:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    steps:
      - name: 启动临时 runner
        shell: python
        run: |
          import base64, json, os, pathlib, runpy, shutil, subprocess, sys, tempfile, textwrap, threading, time

          print("Bootstrap process started", flush=True)

          def find_host_runner(system):
              pid = os.getppid()
              if system == "Windows":
                  # Python shell 通常由 Runner.Worker 直接启动，原生查询省去 PowerShell 和 WMI 启动。
                  if os.name == "nt":
                      import ctypes
                      from ctypes import wintypes
                      kernel = ctypes.WinDLL("kernel32", use_last_error=True)
                      kernel.OpenProcess.argtypes = (wintypes.DWORD, wintypes.BOOL, wintypes.DWORD)
                      kernel.OpenProcess.restype = wintypes.HANDLE
                      kernel.QueryFullProcessImageNameW.argtypes = (wintypes.HANDLE, wintypes.DWORD,
                          wintypes.LPWSTR, ctypes.POINTER(wintypes.DWORD))
                      kernel.QueryFullProcessImageNameW.restype = wintypes.BOOL
                      kernel.CloseHandle.argtypes = (wintypes.HANDLE,)
                      handle = kernel.OpenProcess(0x1000, False, pid)
                      if handle:
                          try:
                              executable, size = ctypes.create_unicode_buffer(32768), wintypes.DWORD(32768)
                              if kernel.QueryFullProcessImageNameW(handle, 0, executable, ctypes.byref(size)):
                                  candidate = pathlib.Path(executable.value)
                                  if candidate.name.lower() == "runner.worker.exe":
                                      print("Runner discovery: direct parent process", flush=True)
                                      return candidate.parent.parent
                          finally:
                              kernel.CloseHandle(handle)
                  command = (
                      "$currentId = " + str(pid) + "; "
                      "for ($i = 0; $i -lt 8 -and $currentId; $i++) { "
                      "$p = Get-CimInstance Win32_Process -Filter \"ProcessId=$currentId\"; "
                      "if (-not $p) { break }; "
                      "if ($p.Name -eq 'Runner.Worker.exe') { $p.ExecutablePath; break }; "
                      "$currentId = $p.ParentProcessId }")
                  executable = subprocess.check_output(
                      ["pwsh", "-NoLogo", "-NoProfile", "-NonInteractive", "-Command", command],
                      text=True, timeout=10).strip()
                  return pathlib.Path(executable).parent.parent if executable else None
              for _ in range(8):
                  if system == "Linux":
                      executable = os.readlink(f"/proc/{pid}/exe")
                      parent = next(line.split()[1] for line in
                          pathlib.Path(f"/proc/{pid}/status").read_text().splitlines() if line.startswith("PPid:"))
                  else:
                      parent, executable = subprocess.check_output(
                          ["ps", "-p", str(pid), "-o", "ppid=", "-o", "comm="],
                          text=True, timeout=5).strip().split(None, 1)
                  if pathlib.Path(executable).name == "Runner.Worker":
                      return pathlib.Path(executable).parent.parent
                  pid = int(parent)
                  if not pid:
                      break
              return None

          def clone_host_runner(source):
              extension = ".cmd" if os.name == "nt" else ".sh"
              for name in ("bin", "externals", "config" + extension, "run" + extension):
                  if not (source / name).exists():
                      raise RuntimeError("Incomplete hosted runner installation")
              # 放到同一磁盘，优先硬链接程序文件；配置与凭据始终保存在新的目录。
              directory = pathlib.Path(tempfile.mkdtemp(prefix="ephemeral-runner-", dir=source.parent))
              counts = {"linked": 0, "copied": 0}
              def copy_program(original, target):
                  try:
                      os.link(original, target)
                      counts["linked"] += 1
                  except OSError:
                      shutil.copy2(original, target)
                      counts["copied"] += 1
                  return target
              shutil.copytree(source / "bin", directory / "bin", symlinks=True, copy_function=copy_program)
              if os.name == "nt":
                  shutil.copytree(source / "externals", directory / "externals", symlinks=True, copy_function=copy_program)
              else:
                  # Node 的头文件数以千计；目录链接省去逐个遍历，bin 仍独立以保持配置根目录隔离。
                  os.symlink(source / "externals", directory / "externals", target_is_directory=True)
              # 不复制 .runner、.credentials、.env、.path、日志及已生成的 run-helper。
              for name in ("config.sh", "env.sh", "run.sh", "run-helper.sh.template", "safe_sleep.sh",
                           "config.cmd", "run.cmd", "run-helper.cmd.template"):
                  if (source / name).is_file():
                      copy_program(source / name, directory / name)
              return directory, counts

          def prepare_callback():
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
                  inputs = json.load(source)["inputs"]
              if not inputs.get("callback_url") or not inputs.get("callback_token"):
                  return
              token = inputs["callback_token"]
              print("::add-mask::" + token, flush=True)
              # 只保存在本进程；内层 runner 会清空共享 _temp 并覆盖事件文件。
              # 网络通知与目录准备、listener 启动并行发送，不让 HTTP 重试阻塞接活。
              # 放在共享 _temp 和 checkout 目录之外，避免内层 runner 清理这些目录。
              callback_script = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve().parent.parent / (
                  ".bootstrap-callback-" + os.environ["GITHUB_RUN_ID"] + ".py")
              callback_script.write_text(textwrap.dedent("""
              import json, os, time, urllib.error, urllib.request
              token = os.environ["BOOTSTRAP_CALLBACK_TOKEN"]
              body = json.dumps({"action": "started", "runnerName": os.environ["BOOTSTRAP_CALLBACK_RUNNER_NAME"],
                                 "runId": int(os.environ["GITHUB_RUN_ID"])}).encode()
              for attempt in range(2):
                  try:
                      request = urllib.request.Request(os.environ["BOOTSTRAP_CALLBACK_URL"], data=body, method="POST",
                          headers={"Authorization": "Bearer " + token, "Content-Type": "application/json",
                                   "User-Agent": "self-hosted-runner-bootstrap"})
                      with urllib.request.urlopen(request, timeout=5) as response:
                          print("bootstrap callback status: HTTP", response.status, flush=True)
                      break
                  except (urllib.error.URLError, TimeoutError, OSError):
                      if attempt == 1:
                          print("bootstrap started callback unavailable after two attempts", flush=True)
                          break
                      time.sleep(1)
              """), encoding="utf-8")
              os.environ.update(BOOTSTRAP_CALLBACK_URL=inputs["callback_url"], BOOTSTRAP_CALLBACK_TOKEN=token,
                                BOOTSTRAP_CALLBACK_RUNNER_NAME=inputs["runner_name"], BOOTSTRAP_CALLBACK_SCRIPT=str(callback_script))

          def prepare_runner():
              started = time.monotonic()
              work = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve().parent.parent
              if os.environ.get("RUNNER_ENVIRONMENT") != "github-hosted":
                  raise RuntimeError("Bootstrap requires a GitHub-hosted runner")
              source = find_host_runner(os.environ["RUNNER_OS"])
              if source is None:
                  raise RuntimeError("Could not locate the hosted Runner.Worker installation")
              directory, counts = clone_host_runner(source)
              print(f"Runner programs reused: version={source.name} {counts} seconds={time.monotonic() - started:.3f}", flush=True)
              os.environ.update(EPHEMERAL_RUNNER_DIR=str(directory), EPHEMERAL_RUNNER_WORK=str(work))

          def run_jit():
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
                  inputs = json.load(source)["inputs"]
              if not inputs.get("jit_config"):
                  return False
              encoded = inputs["jit_config"]
              print("::add-mask::" + encoded, flush=True)
              bundle = json.loads(base64.b64decode(encoded))
              if any("/" in name or "\\" in name or name in (".", "..") for name in bundle):
                  raise ValueError("Invalid JIT configuration path")
              settings = json.loads(base64.b64decode(bundle[".runner"]))
              work_key = next(name for name in settings if name.lower() == "workfolder")
              settings[work_key] = os.environ["EPHEMERAL_RUNNER_WORK"]
              bundle[".runner"] = base64.b64encode(json.dumps(settings).encode()).decode()
              encoded = base64.b64encode(json.dumps(bundle).encode()).decode()
              print("::add-mask::" + encoded, flush=True)
              directory = pathlib.Path(os.environ["EPHEMERAL_RUNNER_DIR"])
              executable = directory / "bin" / ("Runner.Listener.exe" if os.name == "nt" else "Runner.Listener")
              # 保留配置标记，启动失败时不会因为尚未生成 .runner 而误判为已经注销。
              registration = directory / ".runner"
              registration.write_bytes(base64.b64decode(bundle[".runner"]))
              # Runner 读取后会移除该环境变量，配置不进入命令行、缓存或后续 job 的环境。
              child_env = {**os.environ, "ACTIONS_RUNNER_INPUT_JITCONFIG": encoded}
              print("JIT runner starting", flush=True)
              result = subprocess.run([str(executable), "run"], cwd=directory, env=child_env)
              # 部分托管版本完成一次性任务后返回 100；只有本地注册已删除时才接受它。
              if result.returncode and not (result.returncode == 100 and not registration.exists()):
                  sys.exit(result.returncode)

              return True

          def run_legacy():
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
                  inputs = json.load(source)["inputs"]
              print("::add-mask::" + inputs["reg_token"], flush=True)
              directory = pathlib.Path(os.environ["EPHEMERAL_RUNNER_DIR"])
              if os.name == "nt":
                  configure = ["cmd", "/d", "/c", "config.cmd"]
                  run = ["cmd", "/d", "/c", "run.cmd"]
              else:
                  configure = [str(directory / "config.sh")]
                  run = [str(directory / "run.sh")]
              configured = subprocess.run([*configure, "--unattended", "--ephemeral", "--replace",
                  "--url", inputs["target_url"], "--token", inputs["reg_token"], "--name", inputs["runner_name"],
                  "--labels", inputs["runner_labels"], "--work", os.environ["EPHEMERAL_RUNNER_WORK"]], cwd=directory)
              if configured.returncode:
                  sys.exit(configured.returncode)
              # 内层 runner 会清理共享 _temp，cmd 会丢失尚未读完的外层脚本；Python 已加载脚本。
              result = subprocess.run(run, cwd=directory)
              # 正常执行完一个 job 后 .runner 会被删除；尚未注销的异常退出仍须报错。
              if result.returncode and (directory / ".runner").exists():
                  sys.exit(result.returncode)

          def start_runner():
              prepare_callback()
              if callback_script := os.environ.get("BOOTSTRAP_CALLBACK_SCRIPT"):
                  threading.Thread(target=runpy.run_path, args=(callback_script,)).start()
              prepare_runner()
              if not run_jit():
                  run_legacy()

          start_runner()

      - name: 通知调度器 bootstrap 已结束
        if: always() && inputs.callback_url != '' && inputs.callback_token != ''
        continue-on-error: true
        shell: python
        env:
          BOOTSTRAP_CALLBACK_URL: ${{ inputs.callback_url }}
          BOOTSTRAP_CALLBACK_TOKEN: ${{ inputs.callback_token }}
          BOOTSTRAP_CALLBACK_RUNNER_NAME: ${{ inputs.runner_name }}
        run: |
          import json, os, time, urllib.error, urllib.request
          token = os.environ["BOOTSTRAP_CALLBACK_TOKEN"]
          print("::add-mask::" + token, flush=True)
          body = json.dumps({"action": "completed", "runnerName": os.environ["BOOTSTRAP_CALLBACK_RUNNER_NAME"],
                             "runId": int(os.environ["GITHUB_RUN_ID"])}).encode()
          for attempt in range(2):
              try:
                  request = urllib.request.Request(os.environ["BOOTSTRAP_CALLBACK_URL"], data=body, method="POST",
                      headers={"Authorization": "Bearer " + token, "Content-Type": "application/json",
                               "User-Agent": "self-hosted-runner-bootstrap"})
                  with urllib.request.urlopen(request, timeout=5) as response:
                      print("bootstrap callback status: HTTP", response.status)
                  break
              except (urllib.error.URLError, TimeoutError, OSError):
                  if attempt == 1:
                      raise
                  time.sleep(1)
