name: bootstrap

run-name: bootstrap-${{ inputs.runner_name }}

on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: Hosted runner label (e.g. ubuntu-latest, macos-15, windows-2022)
        required: true
        type: string
      target_url:
        description: Target repository URL
        required: true
        type: string
      reg_token:
        description: Runner registration token (one-time)
        required: true
        type: string
      runner_name:
        description: Runner name
        required: true
        type: string
      runner_labels:
        description: Comma-separated runner labels
        required: true
        type: string
      runner_version:
        description: actions/runner version
        required: false
        default: '2.336.0'
        type: string
      watch_url:
        description: 查询目标 job 与本 runner 实际抢到的 job
        required: false
        type: string

jobs:
  bootstrap:
    runs-on: ${{ inputs.runs_on }}
    name: ${{ inputs.runner_name }}
    permissions:
      contents: read
      actions: write
      checks: write
    steps:
      # 按 os/arch/version 缓存压缩包，命中后跳过 GitHub Releases 下载
      - name: Restore runner package
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: runner-pkg
          key: runner-${{ runner.os }}-${{ runner.arch }}-${{ inputs.runner_version }}

      - name: Download runner (Linux)
        if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
        run: |
          ARCH=x64
          [ "${{ runner.arch }}" = "ARM64" ] && ARCH=arm64
          mkdir -p runner-pkg
          curl -o runner-pkg/actions-runner.tar.gz -L \
            https://github.com/actions/runner/releases/download/v${{ inputs.runner_version }}/actions-runner-linux-${ARCH}-${{ inputs.runner_version }}.tar.gz

      - name: Download runner (macOS)
        if: runner.os == 'macOS' && steps.cache.outputs.cache-hit != 'true'
        run: |
          ARCH=x64
          [ "${{ runner.arch }}" = "ARM64" ] && ARCH=arm64
          mkdir -p runner-pkg
          curl -o runner-pkg/actions-runner.tar.gz -L \
            https://github.com/actions/runner/releases/download/v${{ inputs.runner_version }}/actions-runner-osx-${ARCH}-${{ inputs.runner_version }}.tar.gz

      - name: Download runner (Windows)
        if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $arch = if ("${{ runner.arch }}" -eq "ARM64") { "arm64" } else { "x64" }
          New-Item -ItemType Directory -Force -Path runner-pkg | Out-Null
          Invoke-WebRequest -Uri "https://github.com/actions/runner/releases/download/v${{ inputs.runner_version }}/actions-runner-win-$arch-${{ inputs.runner_version }}.zip" -OutFile runner-pkg/actions-runner.zip

      - name: Save runner package
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: runner-pkg
          key: runner-${{ runner.os }}-${{ runner.arch }}-${{ inputs.runner_version }}

      # 从 GITHUB_WORKSPACE 退出两层得到托管 work 根；--work 指到这里，
      # 目标 job 会按派发仓库名铺成 <repo>/<repo>，与 GitHub 托管一致
      - name: Extract runner (Unix)
        if: runner.os != 'Windows'
        run: |
          dir="$(cd "$GITHUB_WORKSPACE/../.." && pwd)"
          tar xzf runner-pkg/actions-runner.tar.gz -C "$dir"
          echo "EPHEMERAL_RUNNER_DIR=$dir" >> "$GITHUB_ENV"

      - name: Extract runner (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '..\..'))
          Expand-Archive -Path runner-pkg/actions-runner.zip -DestinationPath $dir -Force
          Add-Content -Path $env:GITHUB_ENV -Value "EPHEMERAL_RUNNER_DIR=$dir"

      - name: Configure and run ephemeral
        shell: python
        env:
          EPHEMERAL_RUNNER_DIR: ${{ env.EPHEMERAL_RUNNER_DIR }}
          TARGET_URL: ${{ inputs.target_url }}
          REG_TOKEN: ${{ inputs.reg_token }}
          RUNNER_NAME: ${{ inputs.runner_name }}
          RUNNER_LABELS: ${{ inputs.runner_labels }}
          WATCH_URL: ${{ inputs.watch_url }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          import json
          import os
          import pathlib
          import re
          import signal
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request

          root = os.environ["EPHEMERAL_RUNNER_DIR"]
          target_url = os.environ["TARGET_URL"]
          token = os.environ["REG_TOKEN"]
          name = os.environ["RUNNER_NAME"]
          labels = os.environ["RUNNER_LABELS"]
          watch = (os.environ.get("WATCH_URL") or "").strip()
          gh_token = (os.environ.get("GITHUB_TOKEN") or "").strip()
          gh_repo = (os.environ.get("GITHUB_REPOSITORY") or "").strip()
          gh_run = (os.environ.get("GITHUB_RUN_ID") or "").strip()
          is_win = os.name == "nt"
          keep = {"queued", "waiting", "pending", "requested"}
          api = "https://api.github.com"

          def log(msg):
              print(msg, flush=True)

          def title_for(job_name, job_id):
              safe = re.sub(r"[^A-Za-z0-9._-]+", "-", str(job_name or "job")).strip("-._") or "job"
              suffix = "-" + str(job_id)
              return safe[: max(1, 64 - len(suffix))] + suffix

          def gh(method, path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + gh_token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "bootstrap-watch",
                      **({"Content-Type": "application/json"} if body is not None else {}),
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  raw = resp.read()
                  return json.loads(raw.decode()) if raw else {}

          def rename_job(job_name, job_id):
              title = title_for(job_name, job_id)
              if title == name or not gh_token or not gh_repo or not gh_run:
                  return
              jobs = gh("GET", "/repos/" + gh_repo + "/actions/runs/" + gh_run + "/jobs?per_page=20")
              for item in jobs.get("jobs") or []:
                  if str(item.get("status") or "") != "in_progress":
                      continue
                  try:
                      gh("PATCH", "/repos/" + gh_repo + "/check-runs/" + str(item.get("id")), {"name": title})
                      log("bootstrap job 已改为实际抢到的 " + title)
                  except urllib.error.HTTPError as exc:
                      log("改 job name 失败 HTTP " + str(exc.code))
                  return

          def job_state():
              req = urllib.request.Request(
                  watch,
                  headers={"User-Agent": "bootstrap-watch", "Accept": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return json.loads(resp.read().decode())

          def stop(proc):
              if proc.poll() is not None:
                  return
              if is_win:
                  subprocess.call(
                      ["taskkill", "/F", "/T", "/PID", str(proc.pid)],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  return
              try:
                  os.killpg(proc.pid, signal.SIGTERM)
              except OSError:
                  proc.terminate()
              try:
                  proc.wait(timeout=15)
              except subprocess.TimeoutExpired:
                  try:
                      os.killpg(proc.pid, signal.SIGKILL)
                  except OSError:
                      proc.kill()

          if not watch:
              log("缺少 WATCH_URL，拒绝空等")
              sys.exit(1)

          config = [
              "config.cmd" if is_win else "./config.sh",
              "--unattended",
              "--ephemeral",
              "--replace",
              "--url",
              target_url,
              "--token",
              token,
              "--name",
              name,
              "--labels",
              labels,
              "--work",
              root,
          ]
          rc = subprocess.call((["cmd", "/c"] + config) if is_win else config, cwd=root)
          if rc != 0:
              sys.exit(rc)

          runner_cfg = pathlib.Path(root) / ".runner"
          if runner_cfg.is_file():
              cfg = json.loads(runner_cfg.read_text(encoding="utf-8"))
              log("ephemeral=" + str(cfg.get("ephemeral")))

          popen_kw = {"cwd": root}
          if not is_win:
              popen_kw["start_new_session"] = True
          run_cmd = "run.cmd --once" if is_win else ["./run.sh", "--once"]
          if is_win:
              proc = subprocess.Popen(run_cmd, cwd=root, shell=True)
          else:
              proc = subprocess.Popen(run_cmd, **popen_kw)
          renamed = False
          idle_since = None
          done_since = None

          while True:
              rc = proc.poll()
              if rc is not None:
                  sys.exit(rc)
              try:
                  data = job_state()
                  claimed = data.get("claimed") if isinstance(data.get("claimed"), dict) else None
                  if claimed and claimed.get("id"):
                      idle_since = None
                      if not renamed:
                          rename_job(claimed.get("name"), claimed.get("id"))
                          renamed = True
                      if str(claimed.get("status") or "") == "completed" and done_since is None:
                          done_since = time.time() + 120
                  else:
                      status = str(data.get("status") or "")
                      actual = str(data.get("runner_name") or "")
                      if status in keep or actual == name:
                          idle_since = None
                      elif idle_since is None:
                          idle_since = time.time()
                      elif time.time() - idle_since >= 90:
                          log(
                              "目标 job 已结束且未抢到其他 job: status="
                              + status
                              + " runner="
                              + (actual or "-")
                          )
                          stop(proc)
                          sys.exit(0)
              except urllib.error.HTTPError as exc:
                  if exc.code in (400, 401, 404):
                      log("watch 被拒绝 HTTP " + str(exc.code))
                      stop(proc)
                      sys.exit(1)
                  log("watch 失败: " + str(exc))
              except (urllib.error.URLError, TimeoutError, json.JSONDecodeError, OSError) as exc:
                  log("watch 失败: " + str(exc))
              if done_since is not None and time.time() >= done_since:
                  log("目标 job 已结束但 listener 未退出，结束进程")
                  stop(proc)
                  sys.exit(0)
              time.sleep(15)

  # runner 跑完后再套用上游最新一次提交，不拖慢注册
  sync-upstream:
    needs: bootstrap
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply latest openclaw/openclaw commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          TOKEN = os.environ["GITHUB_TOKEN"]
          UPSTREAM = "openclaw/openclaw"
          MAX_BYTES = 1048576
          API = "https://api.github.com"
          SHA_FILE = pathlib.Path(".upstream-sha")

          def gh(url, accept="application/vnd.github+json"):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": accept,
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "bootstrap-sync",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      return resp.read()
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return None
                  raise

          def is_github(path):
              return path == ".github" or path.startswith(".github/")

          def remove(path):
              p = pathlib.Path(path)
              if p.is_file() or p.is_symlink():
                  p.unlink()

          def git(*args, extra_env=None):
              env = os.environ.copy()
              if extra_env:
                  env.update(extra_env)
              subprocess.check_call(["git", *args], env=env)

          payload = gh(f"{API}/repos/{UPSTREAM}/commits/main")
          if not payload:
              sys.exit("无法读取上游最新提交")
          commit = json.loads(payload)
          sha = commit.get("sha") or ""
          if not sha:
              sys.exit("上游提交缺少 sha")
          if SHA_FILE.is_file() and SHA_FILE.read_text(encoding="utf-8").strip() == sha:
              print(f"already at {sha}")
              sys.exit(0)

          for item in commit.get("files") or []:
              name = item.get("filename") or ""
              prev = item.get("previous_filename") or ""
              if not name or is_github(name) or (prev and is_github(prev)):
                  continue
              status = item.get("status") or ""
              if status == "removed":
                  remove(name)
                  continue
              if status == "renamed" and prev:
                  remove(prev)
              encoded = urllib.parse.quote(name, safe="/")
              meta_raw = gh(f"{API}/repos/{UPSTREAM}/contents/{encoded}?ref={sha}")
              if not meta_raw:
                  print(f"skip missing {name}")
                  continue
              meta = json.loads(meta_raw)
              if meta.get("type") != "file":
                  continue
              size = int(meta.get("size") or 0)
              if size > MAX_BYTES:
                  print(f"skip large {name} ({size})")
                  continue
              raw = gh(
                  f"{API}/repos/{UPSTREAM}/contents/{encoded}?ref={sha}",
                  accept="application/vnd.github.raw",
              )
              if raw is None:
                  print(f"skip download {name}")
                  continue
              dest = pathlib.Path(name)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(raw)

          SHA_FILE.write_text(sha + "\n", encoding="utf-8")
          git("add", "-A")
          if subprocess.call(["git", "diff", "--cached", "--quiet"]) == 0:
              print("no changes")
              sys.exit(0)

          info = commit.get("commit") or {}
          author = info.get("author") or {}
          committer = info.get("committer") or {}
          message = info.get("message") or sha
          extra = {
              "GIT_AUTHOR_NAME": author.get("name") or "unknown",
              "GIT_AUTHOR_EMAIL": author.get("email") or "unknown@users.noreply.github.com",
              "GIT_AUTHOR_DATE": author.get("date") or "",
              "GIT_COMMITTER_NAME": committer.get("name") or author.get("name") or "unknown",
              "GIT_COMMITTER_EMAIL": committer.get("email") or author.get("email") or "unknown@users.noreply.github.com",
              "GIT_COMMITTER_DATE": committer.get("date") or author.get("date") or "",
          }
          extra = {k: v for k, v in extra.items() if v}
          pathlib.Path("/tmp/upstream-commit-msg").write_text(message, encoding="utf-8")
          git("commit", "--no-gpg-sign", "-F", "/tmp/upstream-commit-msg", extra_env=extra)
          try:
              git("push")
          except subprocess.CalledProcessError:
              git("pull", "--rebase", "origin", "${{ github.ref_name }}")
              git("push")
          PY
