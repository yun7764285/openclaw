name: bootstrap

run-name: bootstrap-${{ inputs.runner_name }}

on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: GitHub 托管 runner 的系统标签，例如 ubuntu-22.04、macos-15、windows-2025
        required: true
        type: string
      target_url:
        description: 目标仓库 URL
        required: true
        type: string
      reg_token:
        description: runner 注册令牌
        required: false
        default: ''
        type: string
      jit_config:
        description: 调度器预先生成的 JIT runner 配置
        required: false
        default: ''
        type: string
      runner_name:
        description: runner 名称
        required: true
        type: string
      runner_labels:
        description: 以逗号分隔的 runner 标签
        required: true
        type: string
      callback_url:
        description: 调度服务的状态回调地址
        required: false
        default: ''
        type: string
      callback_token:
        description: 仅用于本次派发的回调凭据
        required: false
        default: ''
        type: string

jobs:
  bootstrap:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    steps:
      # 用 Contents API 只下载当前平台的二进制到 _temp，不做 checkout，避免工作区留下 .git。
      # 后续步骤从 PATH 直接启动 Go 二进制，没有常驻的 python/bash/pwsh。
      # 先复制到工作区和共享 _temp 之外，Windows 的内层 checkout 才能正常清理。
      - name: 安装 launcher（Windows）
        id: launcher_windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LAUNCHER_PATH: launcher/dist/launcher-windows-amd64.exe
        run: |
          $file = Join-Path $env:RUNNER_TEMP "bootstrap-launcher-$env:GITHUB_RUN_ID.exe"
          & curl.exe -fsSL --retry 3 -H "Authorization: Bearer $env:GH_TOKEN" -H "Accept: application/vnd.github.raw" -o $file "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/contents/$env:LAUNCHER_PATH`?ref=$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $file install
          exit $LASTEXITCODE

      # 下载的文件没有可执行位；初始化时短暂使用 bash。
      - name: 安装 launcher（Unix）
        id: launcher_unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LAUNCHER_PATH: launcher/dist/launcher-${{ runner.os == 'Linux' && 'linux' || 'darwin' }}-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
        run: |
          file="$RUNNER_TEMP/bootstrap-launcher-$GITHUB_RUN_ID"
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
            -o "$file" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/$LAUNCHER_PATH?ref=$GITHUB_SHA"
          chmod +x "$file"
          "$file" install

      - name: 准备临时 runner
        shell: bootstrap-launcher prepare {0}
        run: prepare

      - name: 启动临时 runner
        shell: bootstrap-launcher run {0}
        run: run

      - name: 通知调度器 bootstrap 已结束
        if: always() && (steps.launcher_windows.outcome == 'success' || steps.launcher_unix.outcome == 'success') && inputs.callback_url != '' && inputs.callback_token != ''
        continue-on-error: true
        shell: bootstrap-launcher notify completed {0}
        env:
          BOOTSTRAP_CALLBACK_URL: ${{ inputs.callback_url }}
          BOOTSTRAP_CALLBACK_TOKEN: ${{ inputs.callback_token }}
          BOOTSTRAP_CALLBACK_RUNNER_NAME: ${{ inputs.runner_name }}
        run: notify completed
