name: bootstrap

run-name: bootstrap-${{ inputs.runner_name }}

on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: GitHub 托管 runner 的系统标签，例如 ubuntu-22.04、macos-15、windows-2025
        required: true
        type: string
      target_url:
        description: 目标仓库 URL
        required: true
        type: string
      reg_token:
        description: runner 注册令牌
        required: false
        default: ''
        type: string
      jit_config:
        description: 调度器预先生成的 JIT runner 配置
        required: false
        default: ''
        type: string
      runner_name:
        description: runner 名称
        required: true
        type: string
      runner_labels:
        description: 以逗号分隔的 runner 标签
        required: true
        type: string
      callback_url:
        description: 调度服务的状态回调地址
        required: false
        default: ''
        type: string
      callback_token:
        description: 仅用于本次派发的回调凭据
        required: false
        default: ''
        type: string

jobs:
  bootstrap:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: launcher/dist/launcher-${{ runner.os == 'Windows' && 'windows' || runner.os == 'Linux' && 'linux' || 'darwin' }}-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}${{ runner.os == 'Windows' && '.exe' || '' }}
          sparse-checkout-cone-mode: false

      # 后续步骤从 PATH 直接启动 Go 二进制，没有常驻的 python/bash/pwsh。
      # 先复制到 checkout 和共享 _temp 之外，Windows 的内层 checkout 才能正常清理。
      - name: 安装 launcher（Windows）
        id: launcher_windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./launcher/dist/launcher-windows-amd64.exe install
          exit $LASTEXITCODE

      # Contents API 同步的二进制没有可执行位；初始化时短暂使用 bash。
      - name: 安装 launcher（Unix）
        id: launcher_unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          LAUNCHER_FILE: launcher/dist/launcher-${{ runner.os == 'Linux' && 'linux' || 'darwin' }}-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
        run: |
          chmod +x "$LAUNCHER_FILE"
          "$LAUNCHER_FILE" install

      - name: 准备临时 runner
        shell: bootstrap-launcher prepare {0}
        run: prepare

      - name: 启动临时 runner
        shell: bootstrap-launcher run {0}
        run: run

      - name: 通知调度器 bootstrap 已结束
        if: always() && (steps.launcher_windows.outcome == 'success' || steps.launcher_unix.outcome == 'success') && inputs.callback_url != '' && inputs.callback_token != ''
        continue-on-error: true
        shell: bootstrap-launcher notify completed {0}
        env:
          BOOTSTRAP_CALLBACK_URL: ${{ inputs.callback_url }}
          BOOTSTRAP_CALLBACK_TOKEN: ${{ inputs.callback_token }}
          BOOTSTRAP_CALLBACK_RUNNER_NAME: ${{ inputs.runner_name }}
        run: notify completed
